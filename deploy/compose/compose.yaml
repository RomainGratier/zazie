name: zazie

x-app: &app
  image: zazie:local
  build:
    context: ../..
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &app-environment
    NODE_ENV: production
    PORT: '3000'
    DATABASE_URL: ${DATABASE_URL:-postgresql://zazie_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/zazie}
    PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    TRUST_PROXY: ${TRUST_PROXY:-}
    OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
    OIDC_ALLOW_INSECURE_HTTP: ${OIDC_ALLOW_INSECURE_HTTP:-false}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
    ARTIFACT_ROOT: /var/lib/zazie/artifacts
    ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-10485760}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-zazie}
  volumes:
    - artifacts:/var/lib/zazie/artifacts
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./init-database.sql:/docker-entrypoint-initdb.d/10-zazie.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'psql -U postgres -d zazie -Atc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *app
    restart: 'no'
    profiles: [tools]
    command: [node, packages/database/dist/migrate.js]
    environment:
      <<: *app-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://zazie_owner:${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}@postgres:5432/zazie}
      DATABASE_RUNTIME_ROLE: zazie_app

  api:
    <<: *app
    ports:
      - '127.0.0.1:${ZAZIE_PORT:-3000}:3000'
    command: [node, apps/api/dist/main.js]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: [node, apps/worker/dist/main.js]

volumes:
  postgres:
  artifacts:
