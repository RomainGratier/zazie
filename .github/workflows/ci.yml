name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The contribution-ci environment requires the owner's approval before
    # allocating a runner, including for Dependabot and subsequent PR updates.
    environment:
      name: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'RomainGratier' && 'contribution-ci' || 'maintainer-ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: zazie
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: zazie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zazie -d zazie_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://zazie:synthetic-ci-only@localhost:5432/zazie_test
      TEST_DATABASE_URL: postgresql://zazie:synthetic-ci-only@localhost:5432/zazie_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm openapi:check
      - run: pnpm test:package
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - if: matrix.node == 24
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.node == 24
        run: sh scripts/test-e2e.sh
      - run: git diff --exit-code
